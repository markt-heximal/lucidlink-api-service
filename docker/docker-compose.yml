version: "3.8"

services:
  lucidlink-api:
    image: lucidlink/lucidlink-api:latest
    container_name: lucidlink-api
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - LUCID_API_PORT=3003
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
